<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAGEN CNV Plot Builder – synthetic demo</title>
<style>
:root {
  color-scheme: light;
  --ink: #17212b;
  --muted: #61707e;
  --line: #d9e1e7;
  --panel: #ffffff;
  --wash: #f4f7f9;
  --accent: #0f6b78;
  --accent-soft: #e2f1f3;
  --radius: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--wash); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
main { max-width: 1540px; margin: 0 auto; padding: 26px 34px 46px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
h1 { margin: 0; font-size: clamp(25px, 2.2vw, 34px); letter-spacing: -0.035em; line-height: 1.08; font-weight: 700; }
.kicker { margin: 0 0 8px; color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; }
.notice { margin: 9px 0 0; color: var(--muted); }
.notice code { color: var(--ink); background: #e8eef1; border-radius: 4px; padding: 2px 5px; }
.summary { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
.toolbar, .plot-panel, .calls-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 18px; padding: 13px 16px; margin-bottom: 16px; }
.control { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.control label { font-size: 12px; font-weight: 600; }
input[type="search"], select { border: 1px solid #bcc9d1; border-radius: 7px; color: var(--ink); background: #fff; padding: 8px 10px; font: inherit; min-height: 35px; }
input[type="search"] { width: 180px; }
select { min-width: 165px; }
input:focus, select:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
.checks { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-left: auto; }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; cursor: pointer; white-space: nowrap; }
.check input { accent-color: var(--accent); }
.plot-panel { padding: 8px 12px 0; min-height: 520px; }
#plot { width: 100%; height: 520px; }
.status { padding: 0 16px 12px; color: var(--muted); font-size: 12px; min-height: 17px; }
.calls-panel { margin-top: 16px; padding: 19px 20px 20px; }
.calls-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
.strand-chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); padding: 4px 9px; font-size: 11px; font-weight: 700; }
.strand-chip .arrow { font-size: 14px; line-height: 1; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { color: var(--muted); font-weight: 700; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); padding: 8px 9px; }
td { border-bottom: 1px solid #edf1f3; padding: 9px; vertical-align: middle; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.sample-cell { display: inline-flex; align-items: center; gap: 7px; }
.sample-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
.filter-tag { display: inline-block; border-radius: 4px; padding: 3px 6px; background: #edf2f4; color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
.filter-tag.pass { background: #e4f3e7; color: #24643b; }
.empty { color: var(--muted); padding: 18px 9px; }
.definitions { margin-top: 17px; border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); font-size: 12px; }
.definitions p { margin: 4px 0; }
.definitions strong { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
.error { color: #a53d3d; font-weight: 600; }
@media (max-width: 760px) {
  main { padding: 18px 14px 30px; }
  header { display: block; }
  .summary { margin-top: 10px; text-align: left; }
  .checks { width: 100%; margin-left: 0; }
  #plot { height: 460px; }
  .plot-panel { min-height: 460px; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="kicker">CNV review aid / synthetic run</p>
      <h1>DRAGEN CNV Plot Builder – synthetic demo</h1>
      <p class="notice">Synthetic data only. Coordinates and calls are illustrative, not clinical results.</p>
    </div>
    <div class="summary">12 genes / 14 samples / lazy per-gene payloads</div>
  </header>
  <section class="toolbar" aria-label="Plot controls">
    <div class="control"><label for="gene-search">Gene</label><input id="gene-search" type="search" list="gene-list" placeholder="Search genes" autocomplete="off"><datalist id="gene-list"><option value="BRCA1"></option><option value="BRCA2"></option><option value="TP53"></option><option value="MLH1"></option><option value="MSH2"></option><option value="PTEN"></option><option value="EGFR"></option><option value="DMD"></option><option value="CFTR"></option><option value="STK11"></option><option value="PMS2"></option><option value="CDKN2A"></option></datalist></div>
    <div class="control"><label for="metric">Y metric</label><select id="metric"><option value="normalized_ratio">normalized_ratio</option><option value="tn_log2">tn_log2</option><option value="segment_mean">segment_mean</option></select></div>
    <div class="checks">
      <label class="check"><input id="toggle-reference" type="checkbox" checked> reference lines</label>
      <label class="check"><input id="toggle-bands" type="checkbox" checked> PASS bands</label>
      <label class="check"><input id="toggle-strand" type="checkbox" checked> strand reversal</label>
      <label class="check"><input id="toggle-ntc" type="checkbox" checked> NTC styling</label>
    </div>
  </section>
  <section class="plot-panel" aria-label="Exon-level copy-number plot">
    <div id="plot" aria-live="polite"></div>
    <div id="status" class="status"></div>
  </section>
  <section class="calls-panel" aria-labelledby="calls-heading">
    <div class="calls-heading"><h2 id="calls-heading">Calls in <span id="current-gene">BRCA1</span></h2><span id="strand-chip" class="strand-chip"></span></div>
    <div id="calls-table" class="table-wrap"></div>
    <div id="definitions" class="definitions"></div>
  </section>
</main>

    normalized_ratio: "normalized ratio",
    tn_log2: "tn_log2",
    segment_mean: "segment mean"

    segment_mean: []

  var normalPalette = [

    return Number(value).toFixed(3).replace(/\.000$/, "");
  }

  function formatMetricValue(value) {

  }

  function displaySample(sample) {
    return sample.ntc ? sample.sample_id + " [NTC]" : sample.sample_id;
  }

  function orderedSamples(payload) {
    return payload.samples.slice().sort(function (left, right) {
      if (left.ntc !== right.ntc) {
        return left.ntc ? 1 : -1;
      }
      return left.sample_id.localeCompare(right.sample_id);
    });
  }

  function sampleColorMap(samples) {
    var colors = new Map();
    var normalIndex = 0;
    var ntcIndex = 0;
    samples.forEach(function (sample) {
      if (sample.ntc) {
        colors.set(sample.sample_id, ntcIndex === 0 ? "#81909b" : "#aab5bd");
        ntcIndex += 1;
      } else {
        colors.set(sample.sample_id, normalColor(normalIndex));
        normalIndex += 1;
      }
    });
    return colors;
  }

    if (index < normalPalette.length) {

    return "hsl(" + hue.toFixed(1) + ", 55%, 42%)";
  }

  function targetOrder(payload) {
    var indices = payload.targets.x.map(function (_, index) { return index; });
    if (state.strand && payload.strand === "-") {
      indices.reverse();
    }
    return indices;
  }

  function metricValue(sample, index) {
    if (state.metric === "normalized_ratio") {
      return Math.pow(2, sample.tn_log2[index]);
    }
    if (state.metric === "tn_log2") {
      return sample.tn_log2[index];
    }
    return sample.segment_mean[index];
  }

  function callsForTarget(payload, sampleId, index) {
    var start = payload.targets.start[index];

        displaySample(sample),
        payload.gene,
        payload.targets.exon_number[index],
        payload.targets.target_name[index],
        payload.contig + ":" + payload.targets.start[index] + "-" + payload.targets.end[index],

          x1: position - 0.5,
          y0: 0,

          line: { color: "#d6dee3", width: 1, dash: "dot" },
          layer: "below"

      }

    return shapes;
  }

        xref: "paper",
        yref: "y",
        x0: 0,
        x1: 1,
        y0: reference.value,
        y1: reference.value,
        line: { color: reference.color, width: 1, dash: "dash" },
        layer: "below"
      };
    });
  }

      var visible = order.filter(function (index) {

          payload.targets.end[index] >= call.start;

      if (!visible.length) {
        return;
      }
      var key = String(call.start) + ":" + String(call.end);
      if (seen.has(key)) {

      }
      seen.add(key);
      var positions = visible.map(function (index) { return order.indexOf(index); });
      var isDup = call.type === "DUP";
      shapes.push({
        type: "rect",
        xref: "x",
        yref: "paper",
        x0: Math.min.apply(null, positions) - 0.5,
        x1: Math.max.apply(null, positions) + 0.5,

        y1: 1,

      positionsByExon.get(exon).push(position);

      }, 0) / positions.length);
      text.push(String(exon));

    return { values: values, text: text };

      uirevision: payload.gene + "-" + state.metric
    };
  }

  function renderPlot(payload) {
    var order = targetOrder(payload);
    var samples = orderedSamples(payload);
    var colors = sampleColorMap(samples);
    var traces = makeTraces(payload, order, samples, colors);
    var layout = plotLayout(payload, order);
    Plotly.react(dom.plot, traces, layout, {
      responsive: true,
      displaylogo: false,
      modeBarButtonsToRemove: ["lasso2d", "select2d"]
    });
    dom.status.textContent = payload.samples.length + " samples overlaid; " +
      payload.targets.start.length + " capture targets across " +
      new Set(payload.targets.exon_number).size + " exons. " +
      (payload.strand === "-" && state.strand ? "Negative strand reversed 5' -> 3'." : "Genomic coordinate order shown.");
    return colors;
  }

  function exonRange(exons) {
    if (!exons || !exons.length) {
      return "n/a";
    }
    var sorted = exons.slice().sort(function (left, right) { return left - right; });
    var ranges = [];
    var start = sorted[0];
    var previous = sorted[0];
    for (var index = 1; index < sorted.length; index += 1) {
      if (sorted[index] !== previous + 1) {
        ranges.push(start === previous ? String(start) : start + "-" + previous);
        start = sorted[index];
      }
      previous = sorted[index];
    }
    ranges.push(start === previous ? String(start) : start + "-" + previous);
    return ranges.join(", ");
  }

  function renderCalls(payload, colors) {
    var calls = payload.calls.slice();
    if (!calls.length) {
      dom.callsTable.innerHTML = '<p class="empty">No calls overlap targets in this gene.</p>';
      dom.definitions.innerHTML = "";
      return;
    }
    var rows = calls.map(function (call) {
      var color = colors.get(call.sample_id) || "#81909b";
      var filterClass = call.filter === "PASS" ? "filter-tag pass" : "filter-tag";
      return "<tr>" +
        "<td><span class=\"sample-cell\"><span class=\"sample-swatch\" style=\"background:" + color + "\"></span>" +
        escapeHtml(call.sample_id) + "</span></td>" +
        "<td>" + escapeHtml(call.type) + "</td>" +
        "<td>" + escapeHtml(call.copy_number) + "</td>" +
        "<td><span class=\"" + filterClass + "\">" + escapeHtml(call.filter) + "</span></td>" +
        "<td>" + formatNumber(call.qual) + "</td>" +
        "<td>" + escapeHtml(payload.contig + ":" + call.start + "-" + call.end) + "</td>" +
        "<td>" + escapeHtml(exonRange(call.exons)) + "</td>" +
        "</tr>";
    }).join("");
    dom.callsTable.innerHTML =
      "<table><thead><tr><th>sample</th><th>type</th><th>copy number</th>" +
      "<th>filter tag</th><th>QUAL</th><th>call region</th>" +
      "<th>exons visible</th></tr></thead><tbody>" + rows + "</tbody></table>";

    var presentFilters = [];
    calls.forEach(function (call) {
      if (presentFilters.indexOf(call.filter) === -1) {
        presentFilters.push(call.filter);
      }
    });
    dom.definitions.innerHTML = presentFilters.map(function (filter) {
      var definition = filterDefinitions[filter] || "caller filter tag present in this view";
      return "<p><strong>" + escapeHtml(filter) + "</strong> = " + escapeHtml(definition) + "</p>";
    }).join("");
  }

  function updateHeader(payload) {
    dom.currentGene.textContent = payload.gene;
    var reversed = payload.strand === "-" && state.strand;
    dom.strandChip.innerHTML =
      '<span class="arrow">' + (payload.strand === "-" ? "-" : "+") + "</span> " +
      escapeHtml(payload.strand === "-" ? (reversed ? "negative / 5' -> 3'" : "negative / genomic") : "positive / genomic");
  }

  function render() {
    var payload = getPayload(state.gene);
    if (!payload) {
      dom.status.innerHTML = '<span class="error">Gene not found. Choose one from the search list.</span>';
      return;
    }
    updateHeader(payload);
    var colors = renderPlot(payload);
    renderCalls(payload, colors);
  }

  function chooseGene(value) {
    var normalized = value.trim().toLowerCase();
    var exact = geneNames.find(function (gene) {
      return gene.toLowerCase() === normalized;
    });
    if (exact) {
      state.gene = exact;
      dom.search.value = state.gene;
      render();
      return;
    }
    var prefix = geneNames.find(function (gene) {
      return gene.toLowerCase().indexOf(normalized) === 0;
    });
    if (prefix && normalized.length > 1) {
      state.gene = prefix;
      render();
    }
  }

  function bindControls() {
    dom.search.addEventListener("input", function () { chooseGene(dom.search.value); });
    dom.metric.addEventListener("change", function () {
      state.metric = dom.metric.value;
      render();
    });
    dom.reference.addEventListener("change", function () {
      state.reference = dom.reference.checked;
      render();
    });
    dom.bands.addEventListener("change", function () {
      state.bands = dom.bands.checked;
      render();
    });
    dom.strand.addEventListener("change", function () {
      state.strand = dom.strand.checked;
      render();
    });
    dom.ntc.addEventListener("change", function () {
      state.ntc = dom.ntc.checked;
      render();
    });
  }

  function initialize() {
    bindControls();
    dom.search.value = state.gene;
    if (typeof Plotly === "undefined") {
      dom.status.innerHTML = '<span class="error">Plotly did not load from the local vendor path.</span>';
      return;
    }
    render();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialize);
  } else {
    initialize();
  }
})();
</script>
</body>
</html>
