[package]
name = "cnvplot-showcase-demo"
version = "4.0.0"
edition = "2021"
description = "Unofficial pure-Rust synthetic demo pipeline for exon-level CNV plot generation"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rayon = "1.10"
regex = "1.11"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
